<!DOCTYPE html>
<html lang="en">
<head>

<title>Ball Game</title>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&display=swap" rel="stylesheet">
<style>:root{--ink:#fff;--deep:#2a1565;--panel:#2b1a6e;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{height:100%;margin:0}body{font-family:"Baloo 2",system-ui,sans-serif;color:var(--ink);overflow:hidden;background:radial-gradient(ellipse at 50% 38%,#ff9ac8 0,transparent 55%),linear-gradient(#4b2fc9 0,#8a3fe0 45%,#ff7fb0 72%,#ffb37a)}.bub{position:fixed;border-radius:50%;background:#ffffff24;animation:float linear infinite;pointer-events:none}@keyframes float{0%{transform:translateY(0)}to{transform:translateY(-110vh)}}.floor{position:fixed;left:-10%;right:-10%;bottom:0;height:30%;background:linear-gradient(#5a2fb8,#2a1565);border-top:5px solid #ffffff55;border-radius:50% 50% 0 0/22px 22px 0 0;box-shadow:0 -10px 40px #ff7fb066}.floor:before{content:"";position:absolute;left:50%;top:26px;width:180px;height:44px;transform:translate(-50%);border:3px solid #ffffff44;border-radius:50%}.menu{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;padding:14px;position:relative}.stage{position:relative;width:190px;height:170px;z-index:1;animation:pop .7s cubic-bezier(.2,1.4,.4,1) both}.ball{position:absolute;left:45px;top:0;width:100px;height:100px;border-radius:50%;transform-origin:50% 100%;animation:bounce 1s cubic-bezier(.5,0,.5,1) infinite alternate;background:radial-gradient(circle at 32% 26%,#fff 0,#fff0 14%),radial-gradient(circle at 36% 30%,#ffe36e,#ffac1c 55%,#d9610a);box-shadow:inset -8px -10px 18px #a8400a99,0 8px 30px #ffb84d88}.ball:before,.ball:after{content:"";position:absolute;border:4px solid #8a3a0a88;border-radius:50%}.ball:before{inset:-4px 34px;border-top:0;border-bottom:0}.ball:after{left:-2px;right:-2px;top:46px;height:0;border-width:3px 0 0;border-radius:0}.shadow{position:absolute;left:35px;bottom:0;width:120px;height:16px;border-radius:50%;background:#1a0b4a;animation:shadow 1s cubic-bezier(.5,0,.5,1) infinite alternate}@keyframes bounce{0%{transform:translateY(0) scale(.97,1.05)}85%{transform:translateY(60px)}to{transform:translateY(66px) scale(1.12,.86)}}@keyframes shadow{0%{transform:scale(.55);opacity:.35}to{transform:scale(1);opacity:.6}}h1{margin:0;font-size:clamp(54px,16vw,84px);line-height:.95;font-weight:800;text-align:center;transform:rotate(-4deg);z-index:1;text-shadow:0 2px 0 #ffd0e6,0 5px 0 #d0408f,0 8px 0 #8a2a90,0 11px 0 #3d1a8a,0 18px 24px #1a0b4a99;animation:pop .7s .12s cubic-bezier(.2,1.4,.4,1) both}.btns{display:flex;flex-direction:column;gap:14px;width:min(310px,100%);z-index:1;margin-top:22px}.btn{--c1:#7d6bff;--c2:#4a35d6;--edge:#2a1a9a;position:relative;display:flex;align-items:center;gap:12px;font:inherit;font-weight:700;font-size:24px;color:#fff;cursor:pointer;border:0;border-radius:22px;padding:11px 16px;background:linear-gradient(var(--c1),var(--c2));box-shadow:0 7px 0 var(--edge),0 12px 20px #1a0b4a66,inset 0 2px #fff8;text-shadow:0 2px 0 #0003;transition:transform .09s,box-shadow .09s;overflow:hidden;animation:pop .6s cubic-bezier(.2,1.4,.4,1) both}.btn:before{content:"";position:absolute;left:10px;right:10px;top:4px;height:42%;border-radius:16px;background:linear-gradient(#fff6,#fff0)}.btn:nth-child(1){animation-delay:.25s}.btn:nth-child(2){animation-delay:.32s}.btn:nth-child(3){animation-delay:.39s}.btn:nth-child(4){animation-delay:.46s}.btn:active{transform:translateY(6px);box-shadow:0 1px 0 var(--edge),0 3px 8px #1a0b4a66,inset 0 2px #fff8}.btn:focus-visible{outline:4px solid #fff;outline-offset:3px}.ic{position:relative;flex:none;width:42px;height:42px;border-radius:14px;background:#0000002e;display:grid;place-items:center;box-shadow:inset 0 2px 4px #0004}.ic svg{width:24px;height:24px;fill:#fff;filter:drop-shadow(0 2px 0 #0004)}.lbl{position:relative;flex:1;text-align:left}.btn.play{--c1:#ffe14d;--c2:#ff9a1f;--edge:#b85a00;font-size:34px;padding:14px 18px;justify-content:center;animation:pop .6s .25s cubic-bezier(.2,1.4,.4,1) both,glow 1.6s 1s ease-in-out infinite alternate;text-shadow:0 2px 0 #b85a00aa}.btn.play .ic{width:50px;height:50px}.btn.play .lbl{flex:none}@keyframes glow{to{filter:brightness(1.12) drop-shadow(0 0 14px #ffd24d)}}.btn.inv{--c1:#37e0c4;--c2:#12a58f;--edge:#0a6a5c}.btn.shop{--c1:#ff7fb4;--c2:#e0407f;--edge:#9a1f55}.btn.set{--c1:#8d9bff;--c2:#5a5fe0;--edge:#2f2f9a}@keyframes pop{0%{opacity:0;transform:translateY(24px) scale(.85)}to{opacity:1;transform:none}}.coins{position:fixed;top:calc(12px + env(safe-area-inset-top,0px));right:14px;z-index:3;display:flex;align-items:center;gap:8px;padding:4px 16px 4px 5px;border-radius:99px;background:#1a0b4acc;font-weight:700;font-size:20px;box-shadow:inset 0 2px #fff3,0 4px #0a0330}.coin{width:28px;height:28px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff3a0,#ffc61a 60%,#d98a00);box-shadow:inset 0 -3px #b86b00}.modal{position:fixed;inset:0;background:#14083ccc;backdrop-filter:blur(4px);display:none;align-items:center;justify-content:center;padding:16px;z-index:5}.modal.open{display:flex}.card{width:min(390px,100%);max-height:86%;overflow:auto;background:linear-gradient(#3a2290,#271565);border-radius:28px;padding:20px;border:3px solid #ffffff33;box-shadow:0 10px #0e0630,0 24px 50px #0008;animation:pop .35s cubic-bezier(.2,1.4,.4,1)}.card h2{margin:0 0 14px;font-size:36px;text-align:center;text-shadow:0 3px 0 #0006}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.tile{background:#ffffff14;border-radius:20px;padding:12px 8px;text-align:center;box-shadow:inset 0 2px #fff2}.tile b{display:block;font-size:17px;margin-top:6px}.orb{width:62px;height:62px;border-radius:50%;margin:0 auto;box-shadow:inset -6px -8px 12px #0004,inset 3px 4px 6px #fff4,0 0 0 1.5px #0003,0 6px 14px #0005}.mini{margin-top:8px;font:inherit;font-weight:700;font-size:17px;color:#fff;border:0;border-radius:14px;padding:6px 16px;cursor:pointer;background:linear-gradient(#ffe14d,#ff9a1f);box-shadow:0 4px #b85a00;text-shadow:0 1px 0 #b85a00}.mini:active{transform:translateY(3px);box-shadow:0 1px #b85a00}.mini[disabled]{background:#ffffff26;box-shadow:none;text-shadow:none;opacity:.7;cursor:default}.row{display:flex;align-items:center;justify-content:space-between;padding:12px 6px;font-size:22px;font-weight:600;border-bottom:2px solid #ffffff14}.row:last-of-type{border:0}.sw{width:64px;height:36px;border:0;border-radius:99px;background:#150b40;position:relative;cursor:pointer;box-shadow:inset 0 3px 6px #0008}.sw:after{content:"";position:absolute;top:4px;left:4px;width:28px;height:28px;border-radius:50%;background:#bbb;transition:left .15s,background .15s;box-shadow:0 3px #0006}.sw[aria-pressed=true]{background:#14b88f}.sw[aria-pressed=true]:after{left:32px;background:#fff}.back{width:100%;margin-top:16px;font-size:22px;justify-content:center;padding:10px}.back:before{display:block}.note{text-align:center;opacity:.8;margin:12px 0 0}.tile small{display:block;font-size:13px;line-height:1.15;opacity:.8;margin:2px 0 4px}.tile.pack{grid-column:1/-1}.note.pull{font-size:20px;font-weight:700;color:#ffe14d;opacity:1;margin:0 0 12px}.tile .pt{font-size:24px;margin:0 0 2px}.orb.s{width:34px;height:34px;display:inline-block;margin:4px 3px}#g{position:fixed;inset:0;z-index:0;background:radial-gradient(ellipse 22% 7% at 18% 16%,#fffffff2 0,#fff0 100%),radial-gradient(ellipse 30% 8% at 30% 20%,#ffffffd9 0,#fff0 100%),radial-gradient(ellipse 24% 6% at 78% 12%,#fffffff0 0,#fff0 100%),radial-gradient(ellipse 32% 8% at 88% 24%,#ffffffcc 0,#fff0 100%),radial-gradient(ellipse 26% 6% at 55% 34%,#ffffffb8 0,#fff0 100%),linear-gradient(#4aa8ff 0,#8ccaff 40%,#cfeaff 56%,#4fa6f0 56.5%,#2a82dc 70%,#1b5fb8)}.menu{z-index:1}.floor,.stage,#bubs,body.ingame .menu,#g .btn{display:none}#g.ingame .btn{display:flex}#g .btn.lock{top:auto;bottom:calc(26px + env(safe-area-inset-bottom,0px));left:50%;margin-left:-95px;width:190px;justify-content:center;font-size:30px;padding:12px 20px}#cv,#gl{position:absolute;inset:0;width:100%;height:100%;touch-action:none}#gl{pointer-events:none}#g .btn{position:absolute;top:calc(12px + env(safe-area-inset-top,0px));left:12px;width:auto;font-size:18px;padding:8px 18px;border-radius:16px;box-shadow:0 5px 0 var(--edge),inset 0 2px #fff8;animation:none}#g .btn:before{display:none}.ball{background:none;box-shadow:none}.ball:before{inset:auto;left:50%;top:50%;width:216px;height:216px;border:0;border-radius:0;transform:translate(-50%,-50%);background:var(--skin) center/contain no-repeat}.ball:after{display:none}.skn{width:112px;height:112px;display:block;margin:-6px auto -2px}.skn.s{width:64px;height:64px;display:inline-block;margin:0 2px}/* refined buttons */.btn{border-radius:12px;font-weight:600;font-size:20px;letter-spacing:.02em;padding:12px 16px;background:linear-gradient(#ffffff12,#ffffff04),#16204a;border:1px solid #ffffff2e;box-shadow:0 4px 14px #0a0f2a88,inset 3px 0 0 var(--c1);text-shadow:none;animation:pop .45s ease-out both}.btn:before{display:none}.btn:active{transform:translateY(1px) scale(.99);box-shadow:0 1px 5px #0a0f2a88,inset 3px 0 0 var(--c1);filter:brightness(.92)}.ic{width:36px;height:36px;border-radius:9px;background:#ffffff14;box-shadow:none}.ic svg{width:20px;height:20px;fill:#d6e4ff;filter:none}.btn.play{font-size:26px;padding:13px 18px;background:linear-gradient(#3f8cff,#2459d8);border-color:#ffffff40;box-shadow:0 5px 16px #0a0f2a99,inset 0 1px #ffffff55;text-shadow:0 1px 2px #0a1e5a99;animation:pop .45s .2s ease-out both}.btn.play:active{box-shadow:0 1px 6px #0a0f2a99,inset 0 1px #ffffff40}.btn.play .ic{width:40px;height:40px;background:#ffffff22}#g .btn{border-radius:10px;font-size:16px;padding:8px 18px;box-shadow:0 3px 10px #0a0f2a88,inset 3px 0 0 var(--c1)}#g .btn:active{box-shadow:0 1px 4px #0a0f2a88,inset 3px 0 0 var(--c1)}#g .btn.lock{font-size:24px;padding:11px 20px;box-shadow:0 5px 16px #0a0f2a99,inset 0 1px #ffffff55}#g .btn.lock:active{box-shadow:0 1px 6px #0a0f2a99,inset 0 1px #ffffff40}.mini{border-radius:8px;font-weight:600;font-size:15px;padding:6px 14px;background:#2b55b8;border:1px solid #ffffff30;box-shadow:none;text-shadow:none}.mini:active{transform:none;box-shadow:none;filter:brightness(.9)}.back{margin-top:16px;font-size:18px;padding:10px}.btn.online{--c1:#4de6ff;--c2:#1aa0c8;--edge:#0a6a80}.btn:nth-child(5){animation-delay:.53s}@media(prefers-reduced-motion:reduce){*{animation:none!important}}
/* Online multiplayer lobby */
#onlineLobby{position:fixed;inset:0;z-index:20;display:none;align-items:center;justify-content:center;padding:18px;background:#080d24d9;backdrop-filter:blur(8px)}
#onlineLobby.open{display:flex}
#onlineLobby .ol-card{width:min(420px,100%);padding:24px;border:1px solid #ffffff35;border-radius:20px;background:linear-gradient(145deg,#202e67,#111a43);box-shadow:0 18px 60px #0009;text-align:center}
#onlineLobby h2{font-size:30px;margin:0 0 8px}
#onlineLobby p{margin:8px 0 16px;opacity:.88}
#onlineLobby .ol-actions{display:grid;gap:10px;margin-top:14px}
#onlineLobby input{width:100%;padding:13px 14px;border:1px solid #ffffff55;border-radius:10px;background:#080f2b;color:white;font:700 20px "Baloo 2",system-ui,sans-serif;text-align:center;letter-spacing:.12em;text-transform:uppercase}
#onlineLobby .ol-code{font-size:34px;font-weight:800;letter-spacing:.18em;color:#ffe14d;padding:8px}
#onlineLobby .ol-status{min-height:28px;font-size:14px;opacity:.9;overflow-wrap:anywhere}
#onlineLobby .ol-close{margin-top:14px;background:#ffffff18;border:1px solid #ffffff35}
</style>
</head>
<body>
<div id="bubs"></div>
<div class="floor"></div>
<div class="coins"><span class="coin"></span><span id="coins">120</span></div>
<main class="menu">
  <div class="stage"><div class="ball"></div><div class="shadow"></div></div>
  <h1>Ball<br>Game</h1>
  <div class="btns">
    <button class="btn play" onclick="play()"><span class="ic"><svg viewBox="0 0 24 24"><path d="M7 4.5v15a1 1 0 001.5.9l12-7.5a1 1 0 000-1.8l-12-7.5A1 1 0 007 4.5z"/></svg></span><span class="lbl">Play</span></button>
    <button class="btn online" id="onlineButton" type="button"><span class="ic"><svg viewBox="0 0 24 24"><path d="M12 2a10 10 0 100 20 10 10 0 000-20zm6.9 9h-3a15.7 15.7 0 00-1.2-5.2A8 8 0 0118.9 11zM12 4c.8 1 1.9 3.1 2.2 7H9.8C10.1 7.1 11.2 5 12 4zM4.1 13h3a15.7 15.7 0 001.2 5.2A8 8 0 014.1 13zm3-2h-3a8 8 0 014.2-5.2A15.700 15.700 0 007.100 11zM12 20c-.8-1-1.9-3.1-2.2-7h4.400c-.3 3.900-1.400 6-2.200 7zm2.700-1.800c.7-1.500 1.100-3.300 1.200-5.200h3a8 8 0 01-4.200 5.200z"/></svg></span><span class="lbl">Online</span></button>
    <button class="btn inv" onclick="openM('inv')"><span class="ic"><svg viewBox="0 0 24 24"><path d="M9 2h6a2 2 0 012 2v1.2A6 6 0 0120 11v8a3 3 0 01-3 3H7a3 3 0 01-3-3v-8a6 6 0 013-5.8V4a2 2 0 012-2zm0 2v1h6V4H9zm-2 9v2h10v-2H7z"/></svg></span><span class="lbl">Inventory</span></button>
    <button class="btn shop" onclick="openM('shop')"><span class="ic"><svg viewBox="0 0 24 24"><path d="M3 4h2.4l.5 2H21l-2 8H8l.4 2H19v2H6.6L4.1 6H3V4zm6 17a1.5 1.5 0 110-3 1.5 1.5 0 010 3zm9 0a1.5 1.5 0 110-3 1.5 1.5 0 010 3z"/></svg></span><span class="lbl">Shop</span></button>
    <button class="btn set" onclick="openM('set')"><span class="ic"><svg viewBox="0 0 24 24"><path d="M12 8.5a3.5 3.5 0 100 7 3.5 3.5 0 000-7zm8.4 5.1l1.8 1.4-2 3.5-2.1-.8a7.6 7.6 0 01-1.7 1l-.3 2.3h-4l-.3-2.3a7.6 7.6 0 01-1.7-1l-2.1.8-2-3.5 1.8-1.4a7.6 7.6 0 010-2l-1.8-1.4 2-3.5 2.1.8a7.6 7.6 0 011.7-1L10 4.2h4l.3 2.3a7.6 7.6 0 011.7 1l2.1-.8 2 3.5-1.7 1.4a7.6 7.6 0 010 2z"/></svg></span><span class="lbl">Settings</span></button>
  </div>
</main>
<div id="g"><canvas id="gl"></canvas><canvas id="cv"></canvas><button class="btn set" onclick="quit()"><span class="lbl">Back</span></button><button class="btn play lock" id="lock" onclick="lock()"><span class="lbl">Lock</span></button></div>

<div id="onlineLobby" aria-hidden="true">
  <div class="ol-card">
    <h2>Online Ball Battle</h2>
    <p>Challenge a friend in a live 1-vs-1 ball battle. Share your room code!</p>
    <div id="olCodeWrap" style="display:none">
      <div class="ol-code" id="olCode"></div>
      <p>Send this code to your friend.</p>
    </div>
    <div class="ol-actions">
      <button class="btn online" id="olHost">Create Room</button>
      <input id="olJoinCode" maxlength="6" inputmode="text" autocomplete="off" placeholder="ROOM CODE" aria-label="Room code">
      <button class="btn play" id="olJoin">Join Room</button>
    </div>
    <p class="ol-status" id="olStatus">Create a room or enter your friend's code.</p>
    <button class="btn ol-close" id="olClose">Back</button>
  </div>
</div>

<div class="modal" id="m" onclick="if(event.target===this)closeM()"><div class="card" id="card"></div></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
<script>
/* ball_skins.js — detailed ball character skins for Ball Game.
 *
 * Usage (canvas):
 *   await BallSkins.ready;                       // wait once for all skins to load
 *   BallSkins.draw(ctx, "Gojo", x, y, radius);   // x,y = ball center, radius = ball body radius
 *
 * Usage (three.js sprite):
 *   const tex = BallSkins.texture("Gojo");       // THREE.CanvasTexture (needs global THREE)
 *   const sprite = new THREE.Sprite(new THREE.SpriteMaterial({map: tex, transparent: true}));
 *   sprite.scale.setScalar(radius * 2 * BallSkins.SCALE);  // SCALE accounts for blades/guns around the body
 *
 * Names: BallSkins.names  (Classic, Blade, Vampire, Projection, Isaac, Moonlord, Smasher, Zenith,
 *        Eye of Cthulhu, Rebecca, Todo, Gojo, Mahito, Nightmare, Foxy, Jacob & Esau, Magdalene,
 *        Azazel, Night Guard, Maine)
 */
(function (global) {
  const VB = 164, ORG = -32;           // viewBox is -32 -32 164 164 so accessories outside the ball are not clipped
  const BODY = 76;                      // ball body diameter inside the viewBox (r=38)
  const SCALE = VB / BODY;              // draw an image this many times the ball diameter

  const E = (x, y, r = 5.5, p = 2.4, c = "#fff") =>
    `<circle cx="${x}" cy="${y}" r="${r}" fill="${c}"/><circle cx="${x + .8}" cy="${y + .6}" r="${p}" fill="#111"/><circle cx="${x - r * .3}" cy="${y - r * .3}" r="${Math.max(.9, r * .22)}" fill="#fff" opacity=".9"/>`;
  const eyes = (y = 46, s = 13, r = 5.5) => E(50 - s, y, r) + E(50 + s, y, r);
  const smile = (y = 60, w = 10) => `<path d="M${50 - w} ${y}Q50 ${y + 9} ${50 + w} ${y}" stroke="#111" stroke-width="2.5" fill="none" stroke-linecap="round"/>`;
  const P = (d, f, s = "none", w = 2) => `<path d="${d}" fill="${f}" stroke="${s}" stroke-width="${w}" stroke-linejoin="round"/>`;
  const L = (d, s = "#111", w = 2.5) => `<path d="${d}" stroke="${s}" stroke-width="${w}" fill="none" stroke-linecap="round"/>`;
  const R = (x, y, w, h, f, rx = 2) => `<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="${rx}" fill="${f}"/>`;
  const ANG = L("M30 36L44 41M70 36L56 41", "#111", 3);
  const teeth = y => P(`M24 ${y}L30 ${y + 11}L36 ${y + 1}L42 ${y + 13}L48 ${y + 2}L54 ${y + 13}L60 ${y + 1}L66 ${y + 11}L72 ${y}Z`, "#eee", "#0004", 1);
  const dot = (x, y, r, f, o = 1) => `<circle cx="${x}" cy="${y}" r="${r}" fill="${f}" opacity="${o}"/>`;

  const D = [
    { n: "Classic", c: ["#fff0a0", "#ffb52e", "#d9740a"], f: L("M50 12v76M12 50h76", "#8a3a0a88", 3) + eyes() + smile() },
    { n: "Blade", c: ["#f5f8ff", "#aab6d0", "#5a6685"],
      b: [-90, 30, 150].map(a => `<g transform="rotate(${a} 50 50)">${P("M50 -6L60 16L40 16Z", "#eef3fc", "#5a6685", 1.6)}${L("M50 -2V14", "#fff", 1.5)}</g>`).join(""),
      f: L("M24 70l12-6M66 30l10-4M60 74l12 4", "#fff9", 1.5) + eyes() + ANG + L("M40 62h20") },
    { n: "Vampire", c: ["#ffb4c6", "#e0345c", "#8a0a2a"],
      b: P("M14 42L0 14L30 30Z", "#ff9ab0", "#7a0a24", 1.5) + P("M86 42L100 14L70 30Z", "#ff9ab0", "#7a0a24", 1.5),
      f: P("M12 44Q50 -4 88 44Q70 30 50 42Q30 30 12 44Z", "#2a0612") + eyes(50, 13, 5) + P("M36 62Q50 72 64 62Z", "#5a0014") + P("M38 62L42 74L46 63Z", "#fff") + P("M54 63L58 74L62 62Z", "#fff") + dot(30, 62, 3, "#ff4a7a", .35) + dot(70, 62, 3, "#ff4a7a", .35) },
    { n: "Projection", c: ["#fff2e2", "#f2c8a2", "#b88358"],
      b: `<circle cx="62" cy="48" r="38" fill="#ffd84a" opacity=".2"/><circle cx="76" cy="46" r="38" fill="#ffd84a" opacity=".13"/><circle cx="90" cy="44" r="38" fill="none" stroke="#ffd84a" stroke-width="1.5" stroke-dasharray="4 3" opacity=".5"/>` + L("M98 28h22M102 50h26M98 72h20", "#ffd84a", 2.2),
